services:
  match-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
    container_name: tg-dating-match-forwarder
    env_file:
      - .env
    ports:
      - "127.0.0.1:94:8080"
    restart: unless-stopped
    # Read-only root filesystem for additional security
    read_only: true
    # Temporary filesystem for any write operations
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

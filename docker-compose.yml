services:
  dating-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-dating-agent
    env_file:
      - .env
    volumes:
      # Session file - gogram writes here even with TG_STRING_SESSION
      - ./session.dat:/app/session.dat
      # Reply audit logs
      - ./logs:/app/logs
    restart: unless-stopped
    # Host network mode for direct network access
    network_mode: host
    # No ports needed - userbot connects outbound to Telegram
    # Read-only root filesystem for additional security
    read_only: true
    # Temporary filesystem for any write operations
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

